<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            transition: background 0.3s;
        }
        .card {
            background: #161b22;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #30363d;
            max-width: 90%;
            width: 350px;
        }
        .mic-badge {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #238636;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 15px rgba(35, 134, 54, 0.6);
            transition: all 0.3s ease;
        }
        .listening {
            animation: pulse 1.5s infinite;
            background: #da3633;
            box-shadow: 0 0 20px rgba(218, 54, 51, 0.8);
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }
        #status { margin-top: 15px; font-size: 18px; color: #58a6ff; font-weight: 600; }
        #cmd { margin-top: 10px; font-size: 15px; color: #8b949e; background: #0d1117; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="card" id="mainCard">
    <div id="micIcon" class="mic-badge">🎙️</div>
    <h2>অটোমেটিক ভয়েস অ্যাসিস্ট্যান্ট</h2>
    <p style="font-size: 13px; color: #8b949e;">একবার 'Start' ক্লিক করলে এটি অনবরত ভয়েস শুনবে</p>
    
    <button id="startBtn" onclick="toggleListening()">▶️ ভয়েস সিস্টেম শুরু করুন</button>
    
    <div id="status">স্ট্যাটাস: সিস্টেম বন্ধ আছে</div>
    <div id="cmd">আপনি বলেছেন: -</div>
</div>

<script>
    let recognition = null;
    let isSystemActive = false;
    let track = null;

    function initSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("আপনার ব্রাউজারে ভয়েস সাপোর্ট নেই! Chrome ব্যবহার করুন।");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'bn-BD';

        recognition.onstart = function() {
            document.getElementById('status').innerText = "স্ট্যাটাস: লাইভ শুনছি... (কথা বলুন)";
            document.getElementById('micIcon').classList.add('listening');
        };

        recognition.onresult = async function(event) {
            const lastIndex = event.results.length - 1;
            const command = event.results[lastIndex][0].transcript.toLowerCase().trim();
            document.getElementById('cmd').innerText = "আপনি বলেছেন: " + command;
            
            await executeCommand(command);
        };

        recognition.onend = function() {
            if (isSystemActive) {
                recognition.start();
            } else {
                document.getElementById('status').innerText = "স্ট্যাটাস: বন্ধ করা হয়েছে";
                document.getElementById('micIcon').classList.remove('listening');
            }
        };

        recognition.onerror = function(event) {
            if (isSystemActive && event.error !== 'no-speech') {
                setTimeout(() => { recognition.start(); }, 1000);
            }
        };
    }

    function toggleListening() {
        if (!recognition) initSpeech();

        const btn = document.getElementById('startBtn');
        if (!isSystemActive) {
            isSystemActive = true;
            recognition.start();
            btn.innerText = "⏹️ ভয়েস বন্ধ করুন";
            btn.style.backgroundColor = "#da3633";
        } else {
            isSystemActive = false;
            recognition.stop();
            btn.innerText = "▶️ ভয়েস সিস্টেম শুরু করুন";
            btn.style.backgroundColor = "#238636";
        }
    }

    async function executeCommand(cmd) {
        // ১. ফ্ল্যাশলাইট / লাইট অন ও অফ (বাংলা ও ইংরেজি শব্দ)
        if (cmd.includes("ফ্ল্যাশ") || cmd.includes("flash") || cmd.includes("light") || cmd.includes("আলো")) {
            if (cmd.includes("off") || cmd.includes("বন্ধ") || cmd.includes("নেভাও")) {
                await toggleTorch(false);
                document.getElementById('status').innerText = "স্ট্যাটাস: Flashlight OFF";
                speakText("ফ্ল্যাশ বন্ধ করা হলো");
            } else {
                await toggleTorch(true);
                document.getElementById('status').innerText = "স্ট্যাটাস: Flashlight ON";
                speakText("ফ্ল্যাশ চালু করা হলো");
            }
        } 
        // ২. ইউটিউব ওপেন
        else if (cmd.includes("ইউটিউব") || cmd.includes("youtube")) {
            document.getElementById('status').innerText = "স্ট্যাটাস: Opening YouTube";
            speakText("ইউটিউব খোলা হচ্ছে");
            window.open("https://www.youtube.com", "_blank");
        }
        // ৩. ফেসবুক ওপেন
        else if (cmd.includes("ফেসবুক") || cmd.includes("facebook") || cmd.includes("fb")) {
            document.getElementById('status').innerText = "স্ট্যাটাস: Opening Facebook";
            speakText("ফেসবুক খোলা হচ্ছে");
            window.open("https://www.facebook.com", "_blank");
        }
        // ৪. গুগল ওপেন
        else if (cmd.includes("গুগল") || cmd.includes("google")) {
            document.getElementById('status').innerText = "স্ট্যাটাস: Opening Google";
            speakText("গুগল খোলা হচ্ছে");
            window.open("https://www.google.com", "_blank");
        }
        // ৫. কল ডায়ালার ওপেন
        else if (cmd.includes("কল") || cmd.includes("call") || cmd.includes("dial")) {
            document.getElementById('status').innerText = "স্ট্যাটাস: Opening Dialer";
            speakText("কল ডায়ালার খোলা হচ্ছে");
            window.location.href = "tel:";
        }
        // ৬. ভাইব্রেশন
        else if (cmd.includes("ভাইব্রেট") || cmd.includes("vibrate")) {
            if (navigator.vibrate) {
                navigator.vibrate([500, 200, 500]);
                speakText("Vibrating");
            }
        }
        else {
            document.getElementById('status').innerText = "স্ট্যাটাস: অজানা কমান্ড";
            speakText("কমান্ডটি বোঝা যায়নি");
        }
    }

    async function toggleTorch(on) {
        try {
            if (on) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                track = stream.getVideoTracks()[0];
                await track.applyConstraints({ advanced: [{ torch: true }] });
            } else {
                if (track) {
                    track.stop();
                    track = null;
                }
                document.body.style.backgroundColor = "#0d1117";
            }
        } catch (err) {
            // হার্ডওয়্যার টর্চ ব্লক হলে পুরো স্ক্রিন সাদা হয়ে লাইটের কাজ করবে
            if (on) {
                document.body.style.backgroundColor = "#ffffff";
                alert("ক্যামেরা লাইট সাপোর্ট করেনি! স্ক্রিনের আলো বাড়িয়ে দেওয়া হলো।");
            }
        }
    }

    function speakText(text) {
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'bn-BD';
        window.speechSynthesis.speak(speech);
    }
</script>

</body>
</html>
