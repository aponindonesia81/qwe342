<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Voice Controller</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #111; color: #fff; height: 100vh; overflow: hidden; }
        
        /* ফোনের ফুল স্ক্রিনে কন্টেন্ট দেখার ফ্রেম */
        #contentFrame { width: 100vw; height: 100vh; border: none; background: #222; }

        /* ভাসমান পপ-আপ ভয়েস কনসোল */
        .voice-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00ff88;
            border-radius: 15px;
            padding: 15px;
            width: 220px;
            box-shadow: 0 4px 20px rgba(0,255,136,0.4);
            z-index: 99999;
            text-align: center;
        }
        
        .mic-btn { background: #00ff88; color: #000; border: none; padding: 10px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .status { font-size: 12px; margin-top: 8px; color: #ddd; }
    </style>
</head>
<body>

    <!-- মূল ডিসপ্লে ভিউয়ার -->
    <iframe id="contentFrame" src="about:blank"></iframe>

    <!-- স্ক্রিনের কোণায় পপ-আপ কনসোল -->
    <div class="voice-popup">
        <button class="mic-btn" onclick="startVoice()">🎙️ ভয়েস শুরু করুন</button>
        <div id="status" class="status">কমান্ডের অপেক্ষায়...</div>
    </div>

<script>
    let streamTrack = null;
    let recognition = null;

    function startVoice() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return alert("Chrome ব্যবহার করুন");

        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.lang = 'bn-BD';

        recognition.onstart = () => document.getElementById('status').innerText = "শুনছি...";

        recognition.onresult = async (e) => {
            const cmd = e.results[e.results.length - 1][0].transcript.toLowerCase().trim();
            document.getElementById('status').innerText = "বলেছেন: " + cmd;
            handleCommand(cmd);
        };

        recognition.onend = () => recognition.start();
        recognition.start();
    }

    async function handleCommand(cmd) {
        // ১. ফ্ল্যাশলাইট কন্ট্রোল (অন ও অফ)
        if (cmd.includes("ফ্ল্যাশ") || cmd.includes("flash") || cmd.includes("লাইট")) {
            if (cmd.includes("বন্ধ") || cmd.includes("off") || cmd.includes("নেভাও")) {
                stopFlash();
            } else {
                startFlash();
            }
        }
        // ২. ইউটিউব (পপ-আপ এর পেছনে ফ্রেম আকারে খুলবে)
        else if (cmd.includes("ইউটিউব") || cmd.includes("youtube")) {
            document.getElementById('contentFrame').src = "https://www.youtube.com/embed";
        }
        // ৩. ফেসবুক / মেসেঞ্জার / টিকটক
        else if (cmd.includes("ফেসবুক") || cmd.includes("facebook")) {
            window.location.href = "fb://";
        } else if (cmd.includes("মেসেঞ্জার") || cmd.includes("messenger")) {
            window.location.href = "fb-messenger://";
        } else if (cmd.includes("টিকটক") || cmd.includes("tiktok")) {
            window.location.href = "snssdk1128://"; // TikTok App URI
        }
    }

    async function startFlash() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            streamTrack = stream.getVideoTracks()[0];
            await streamTrack.applyConstraints({ advanced: [{ torch: true }] });
        } catch (e) { alert("ফ্ল্যাশলাইট অন করা যায়নি!"); }
    }

    function stopFlash() {
        if (streamTrack) {
            streamTrack.stop(); // ফ্ল্যাশ বন্ধ নিশ্চিত করা
            streamTrack = null;
            document.getElementById('status').innerText = "ফ্ল্যাশ বন্ধ হয়েছে";
        }
    }
</script>
</body>
</html>
